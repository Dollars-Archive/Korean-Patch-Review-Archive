name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# 상태 커밋은 watchlist-data 브랜치에만 쌓이므로 이 워크플로를 트리거하지 않는다.
# main 푸시 또는 수동 실행에서만 검증·테스트 후 배포한다.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate catalog and shared state
        run: node scripts/validate-catalog.cjs

      - name: Run unit tests
        run: node --test tests/*.cjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
